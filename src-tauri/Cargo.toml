[package]
name = "app"
version = "0.1.6"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "markdown_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# The explicit `features = []` is the tauri CLI's normalized form — it
# rewrites the manifest on every `tauri build`. Keeping it avoids churn;
# plain cargo ignores the difference.
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
trash = "5.2.3"
notify = "8.2.0"
# OpenAI-compatible chat completions client for document translation,
# matching the reqwest/rustls versions already locked in the tree by
# tauri-plugin-updater. reqwest 0.13 split its old `rustls-tls` feature:
# `rustls-no-provider` leaves the crypto provider to the tree. rustls 0.23
# defaults to the aws-lc-rs provider, so the ring provider is pinned here
# explicitly (as tauri-plugin-updater does).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# macOS-only bindings for the WKWebView under-page background (see
# window_background.rs) and installed-font enumeration (see fonts.rs).
# Pinned to the exact versions wry already locks so the types line up with
# the webview handles tauri hands over in `with_webview`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["std", "objc2-core-foundation", "NSColor"] }
# Direct dependency so the `CFArray`/`CFString` types used by fonts.rs can
# enable their features here (objc2-core-text's `CTFontManager` only pulls in
# `CFArray`; the returned family names are `CFString`s).
objc2-core-foundation = { version = "0.3.2", features = ["std", "CFArray", "CFString"] }
objc2-core-text = { version = "0.3.2", features = ["std", "CTFontManager"] }
objc2-foundation = { version = "0.3.2", features = ["std", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3.2", features = ["std", "objc2-core-foundation", "objc2-app-kit", "WKWebView"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
