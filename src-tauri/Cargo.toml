[package]
name = "app"
version = "0.1.17"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "markdown_edit_lib"
# Desktop-only crate: the template's `staticlib`/`cdylib` exist for mobile
# builds, and the cdylib also fails to link on windows-gnu — every symbol is
# exported there, blowing past the 65535-entry PE export table limit.
crate-type = ["rlib"]

[build-dependencies]
# The explicit `features = []` is the tauri CLI's normalized form — it
# rewrites the manifest on every `tauri build`. Keeping it avoids churn;
# plain cargo ignores the difference.
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
trash = "5.2.3"
notify = "8.2.0"
# OpenAI-compatible chat completions client for document translation,
# matching the reqwest/rustls versions already locked in the tree by
# tauri-plugin-updater. reqwest 0.13 split its old `rustls-tls` feature:
# `rustls-no-provider` leaves the crypto provider to the tree. rustls 0.23
# defaults to the aws-lc-rs provider, so the ring provider is pinned here
# explicitly (as tauri-plugin-updater does).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Async sleep for the translation client's 429 Retry-After wait; tokio is
# already locked in the tree via tauri, this only adds the `time` feature.
tokio = { version = "1", features = ["time"] }

# Translation API keys live in the OS credential store (see api_keys.rs), not
# in session.json. keyring selects its backend by feature, so each target
# enables exactly one and no unrelated store is linked. Version 3.x, not 4.x:
# keyring 4 is edition-2024 and requires rustc 1.88, while this crate's MSRV
# is 1.77.2. 3.x is the maintained line for that toolchain and is the last
# one to select its backend at compile time — keyring 4 hands store
# registration to the application at runtime.

# macOS-only bindings for the WKWebView under-page background (see
# window_background.rs) and installed-font enumeration (see fonts.rs).
# Pinned to the exact versions wry already locks so the types line up with
# the webview handles tauri hands over in `with_webview`.
[target.'cfg(target_os = "macos")'.dependencies]
# Login Keychain, through security-framework 3 (already locked in the tree by
# tauri's own macOS dependencies).
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2-app-kit = { version = "0.3.2", features = ["std", "objc2-core-foundation", "NSColor"] }
# Direct dependency so the `CFArray`/`CFString` types used by fonts.rs can
# enable their features here (objc2-core-text's `CTFontManager` only pulls in
# `CFArray`; the returned family names are `CFString`s).
objc2-core-foundation = { version = "0.3.2", features = ["std", "CFArray", "CFString"] }
objc2-core-text = { version = "0.3.2", features = ["std", "CTFontManager"] }
objc2-foundation = { version = "0.3.2", features = ["std", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3.2", features = ["std", "objc2-core-foundation", "objc2-app-kit", "WKWebView"] }

# Windows-only: single-instance forwards a second launch's argv to the
# running instance (see lib.rs; Windows has no RunEvent::Opened), winreg
# reads the installed-font registry keys (see fonts.rs), and windows-sys
# reads file identities (volume serial + file index; the std accessors are
# still nightly-only — see document_io.rs).
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# Credential Manager (windows-sys 0.60, already locked in the tree).
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

# Linux: the Secret Service (org.freedesktop.secrets) over zbus. The
# async-secret-service backend is the pure-Rust D-Bus route — it needs a
# runtime and a cipher, and `tokio` reuses the runtime tauri already links
# while `crypto-rust` uses RustCrypto (sha2 is already a dependency), so no
# libdbus or OpenSSL C library is pulled in. The synchronous alternative,
# sync-secret-service, links libdbus and is deliberately not used.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "crypto-rust", "tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
