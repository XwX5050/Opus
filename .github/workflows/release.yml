name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - name: Configure optional Apple signing
        env:
          OPUS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          OPUS_APPLE_ID: ${{ secrets.APPLE_ID }}
          OPUS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          OPUS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$OPUS_APPLE_SIGNING_IDENTITY" ]]; then
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$OPUS_APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            printf 'APPLE_ID=%s\n' "$OPUS_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_PASSWORD=%s\n' "$OPUS_APPLE_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$OPUS_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing. TAURI_SIGNING_PRIVATE_KEY is the contents of the
          # minisign secret key file (~/.tauri/opus-updater.key); the key is
          # password-less, so TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty but
          # must still be defined for the bundler.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing/notarization. When the APPLE_* secrets are not
          # configured the artifacts are unsigned local builds; when set,
          # the step above exports them for Developer ID signing and notarization.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Opus ${{ github.ref_name }}"
          generateReleaseNotes: true
          args: --bundles app,dmg

  # Linux AppImage. Uploads into the same release as the macOS job (same
  # tagName); tauri-action merges both platforms into the updater's
  # latest.json. Release notes are generated by the macOS job only.
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip predates RELR and fails on bleeding-
          # edge distro libraries.
          NO_STRIP: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Opus ${{ github.ref_name }}"
          args: --bundles appimage
