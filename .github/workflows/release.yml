name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Creates the tag's release up front — as a draft — so the three platform
  # jobs below all upload into a release that already exists. tauri-action's
  # own release handling ("look up the release by tag, create it when
  # missing") is not atomic, and two jobs that observe "no release" in the
  # same window make the loser fail with
  # `Validation Failed: {"code":"already_exists","field":"tag_name"}`.
  # That is exactly how v0.1.16 failed (run 34672533046): the macOS job's
  # lookup came back empty at 04:24:33.18, the release was created in that
  # same second, and the macOS job's create collided 0.6s later.
  #
  # Keeping the release a draft until publish-release runs means a run that
  # dies part-way leaves no half-filled release behind: the Releases page and
  # the updater URL /releases/latest/download/latest.json keep serving the
  # previous, complete release until every platform has uploaded.
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the release exists as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists (draft or published); reusing it."
          elif ! gh release create "$tag" \
            --title "Opus $tag" \
            --draft \
            --generate-notes \
            --verify-tag; then
            # A concurrent run (or anything else) may have created the release
            # between the lookup and the create; that is a reuse, not a failure.
            gh release view "$tag" >/dev/null 2>&1 || exit 1
            echo "Release $tag was created concurrently; reusing it."
          fi

  release:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      # Apple signing is optional: with all five APPLE_* secrets the build is
      # Developer ID signed and notarized (the step exports them to
      # $GITHUB_ENV for tauri-action); with none it ships unsigned (the
      # project's default — no paid Apple Developer Program) and the release
      # notes get a first-launch install note below. A partial set would
      # produce a signed-but-unnotarized build that Gatekeeper still blocks,
      # so that is a hard error. Updater signing stays mandatory: without it
      # the minisign-signed updater channel breaks for every install.
      - name: Check release signing secrets
        id: signing
        env:
          OPUS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPUS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          OPUS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          OPUS_APPLE_ID: ${{ secrets.APPLE_ID }}
          OPUS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          OPUS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$OPUS_TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::A public release requires updater signing. Missing GitHub Secret: TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          present=0
          for v in "$OPUS_APPLE_CERTIFICATE" "$OPUS_APPLE_CERTIFICATE_PASSWORD" "$OPUS_APPLE_ID" "$OPUS_APPLE_PASSWORD" "$OPUS_APPLE_TEAM_ID"; do
            [[ -n "$v" ]] && present=$((present + 1))
          done
          if (( present == 5 )); then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            # Export only in signed mode: an empty-but-present
            # APPLE_CERTIFICATE makes the bundler attempt a keychain import
            # and fail, so unsigned mode must leave the variables ABSENT.
            {
              printf 'APPLE_CERTIFICATE=%s\n' "$OPUS_APPLE_CERTIFICATE"
              printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$OPUS_APPLE_CERTIFICATE_PASSWORD"
              printf 'APPLE_ID=%s\n' "$OPUS_APPLE_ID"
              printf 'APPLE_PASSWORD=%s\n' "$OPUS_APPLE_PASSWORD"
              printf 'APPLE_TEAM_ID=%s\n' "$OPUS_APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Updater signing, Developer ID signing, and notarization credentials are configured."
          elif (( present == 0 )); then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Force a proper ad-hoc re-sign during bundling. Without an
            # identity the bundle keeps the linker's ad-hoc signature, which
            # `codesign --verify` rejects ("code has no resources but
            # signature indicates they must be present") — the app still runs
            # after the Gatekeeper bypass, but the release artifact should
            # pass the project's own verification script.
            printf 'APPLE_SIGNING_IDENTITY=-\n' >> "$GITHUB_ENV"
            echo "::warning::No APPLE_* secrets configured — building an UNSIGNED macOS release (ad-hoc signature, no notarization). Users bypass Gatekeeper on first launch; the release notes get an install note."
          else
            echo "::error::APPLE_* secrets are partially configured ($present/5). Set all five for a signed and notarized release, or unset them all for an unsigned one — a signed-but-unnotarized build is still blocked by Gatekeeper."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing. TAURI_SIGNING_PRIVATE_KEY is the contents of the
          # minisign secret key file (~/.tauri/opus-updater.key); the key is
          # password-less, so TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty but
          # must still be defined for the bundler.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing/notarization: the check step above exports the five
          # APPLE_* variables via $GITHUB_ENV only when all are configured.
          # They must NOT be declared here — an empty-but-present
          # APPLE_CERTIFICATE makes tauri's bundler run `security import` and
          # fail; absent variables are what produce the unsigned build.
          # Tauri infers the Developer ID identity from APPLE_CERTIFICATE.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Opus ${{ github.ref_name }}"
          generateReleaseNotes: true
          # Upload into the draft created by prepare-release. This input is
          # required for that: with releaseDraft=false the action looks the
          # release up with "get release by tag", which only ever returns
          # *published* releases, so it would try to create one and fail with
          # already_exists. In draft mode the action scans the release list
          # (drafts included) for the tag and reuses it, and it never publishes
          # the release itself.
          releaseDraft: true
          args: --bundles app,dmg
      # Unsigned builds are blocked by Gatekeeper on first launch, so the
      # release notes must tell users how to install. Appended once (marker
      # guard) after tauri-action, which may regenerate the notes body.
      - name: Append unsigned-build install note to the release notes
        if: steps.signing.outputs.signed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          marker="<!-- unsigned-macos-note -->"
          body="$(gh release view "$tag" --json body --jq .body)"
          if [[ "$body" == *"$marker"* ]]; then
            echo "Install note already present; leaving the release notes unchanged."
            exit 0
          fi
          note_file="$(mktemp -t opus-release-note)"
          trap 'rm -f "$note_file"' EXIT
          {
            printf '%s\n' "$body"
            printf '\n---\n\n'
            printf '%s\n' '<!-- unsigned-macos-note -->'
            printf '%s\n' '**macOS 安装说明（未签名版本）**：本版本未经 Apple 签名与公证，首次打开会被 Gatekeeper 拦截（提示“无法验证开发者”或“已损坏”）。请打开「系统设置 → 隐私与安全性」，在“安全性”一栏点击 Opus 旁的「仍要打开」；若不行，在终端执行 `xattr -cr /Applications/Opus.app` 后重新打开。只需操作一次，之后升级走应用内自动更新。'
            printf '\n'
            printf '%s\n' '**macOS installation (unsigned build)**: this build is not Developer ID signed or notarized, so Gatekeeper blocks the first launch. Open System Settings → Privacy & Security and click “Open Anyway” next to Opus; if that is not offered, run `xattr -cr /Applications/Opus.app` in Terminal and open it again. You only need to do this once — later versions arrive through the in-app updater.'
          } > "$note_file"
          gh release edit "$tag" --notes-file "$note_file"

  # Linux AppImage. Uploads into the same release as the macOS job (same
  # tagName); tauri-action merges both platforms into the updater's
  # latest.json. Release notes are generated by prepare-release only.
  release-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip predates RELR and fails on bleeding-
          # edge distro libraries.
          NO_STRIP: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Opus ${{ github.ref_name }}"
          releaseDraft: true
          args: --bundles appimage

  # Windows NSIS installer. Uploads into the same release as the macOS and
  # Linux jobs (same tagName); tauri-action merges all platforms into the
  # updater's latest.json. Release notes are generated by prepare-release only.
  release-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test
        working-directory: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Opus ${{ github.ref_name }}"
          releaseDraft: true
          args: --bundles nsis

  # Publishes the release once every platform job uploaded its artifacts, so
  # nothing users can see (Releases page, /releases/latest/download) ever
  # points at an incomplete release. If a platform job fails this job is
  # skipped and the release stays a draft; see docs/releasing.md for the
  # recovery steps.
  publish-release:
    needs: [release, release-linux, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A failed lookup (missing release, API hiccup) must not read as
          # "already published" and let the run go green without publishing.
          if ! draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            echo "::error::No release found for $tag; prepare-release should have created it."
            exit 1
          fi
          case "$draft" in
            true) gh release edit "$tag" --draft=false ;;
            false) echo "Release $tag is already published; nothing to publish." ;;
            *)
              echo "::error::Unexpected release state for $tag: isDraft=$draft"
              exit 1
              ;;
          esac

          # Publishing defaults make_latest to true; if that did not happen the
          # updater keeps serving the previous release, which is worth a warning.
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$tag" ]]; then
            echo "::warning::/releases/latest still resolves to $latest, not $tag; existing installs keep updating from $latest."
          fi

          gh release view "$tag" --json tagName,isDraft,assets \
            --jq '"published \(.tagName) draft=\(.isDraft) assets=\([.assets[].name] | join(", "))"'
