name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run test:node
      - run: npm run build
      - run: npm run perf:build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo clippy --features native-e2e -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo test --features native-e2e --lib native_e2e
        working-directory: src-tauri

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-output
          # test-results/ holds per-test traces (trace: retain-on-failure);
          # playwright-report/ exists only when the html reporter is used.
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The macOS job never compiles the cfg(target_os = "linux") branches, so
  # the Linux port needs its own gate: frontend build plus fmt/clippy/tests
  # of the Rust backend against the real Linux toolchain.
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo clippy --features native-e2e -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo test --features native-e2e --lib native_e2e
        working-directory: src-tauri

  # Native smoke run of the feature-gated test build under Xvfb. Linux is the
  # only hosted runner that can open a WebKitGTK window headlessly here; the
  # macOS and Windows native builds are verified locally.
  native-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf xvfb xauth
      - run: npm ci
      - run: xvfb-run --auto-servernum npm run test:native -- --build --scenario all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-e2e-output
          path: test-results/native-e2e/
          retention-days: 7
          if-no-files-found: ignore

  # The macOS and Linux jobs never compile the cfg(target_os = "windows")
  # branches, so Windows needs its own gate: frontend tests/build plus
  # fmt/clippy/tests of the Rust backend against the real Windows toolchain.
  # No system deps needed - WebView2 is preinstalled on the runners.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run test:node
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features native-e2e -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features native-e2e --lib native_e2e
